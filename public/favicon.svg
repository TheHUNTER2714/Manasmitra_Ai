<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <radialGradient id="favBg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="60%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>
    <linearGradient id="favEmblemGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="35%" stop-color="#ec4899" />
      <stop offset="70%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="favOrbitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bef226" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="favGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background rounded squircle with glowing rim -->
  <rect x="6" y="6" width="108" height="108" rx="30" fill="url(#favBg)" stroke="rgba(244,63,94,0.4)" stroke-width="2.5"/>

  <!-- Orbital ring -->
  <ellipse cx="60" cy="60" rx="46" ry="18" fill="none" stroke="url(#favOrbitGrad)" stroke-width="2.8" stroke-dasharray="16 8" transform="rotate(-30 60 60)"/>

  <!-- Orbiting pulse star -->
  <circle cx="20" cy="60" r="4" fill="#bef226" filter="url(#favGlow)"/>

  <!-- Merged Mind & Heart Silhouette -->
  <path d="M 60 35
           C 48 20, 24 22, 22 45
           C 20 60, 32 76, 60 98
           C 88 76, 100 60, 98 45
           C 96 22, 72 20, 60 35 Z"
        fill="url(#favEmblemGrad)"
        filter="url(#favGlow)"/>

  <!-- Synapse Nodes -->
  <circle cx="42" cy="40" r="4.5" fill="#ffffff"/>
  <circle cx="78" cy="40" r="4.5" fill="#ffffff"/>
  <circle cx="60" cy="56" r="5.5" fill="#ffffff"/>

  <!-- ECG Trace across the center -->
  <path d="M 28 60 L 44 60 L 52 46 L 60 74 L 68 50 L 76 60 L 92 60"
        fill="none"
        stroke="#ffffff"
        stroke-width="3.5"
        stroke-linecap="round"
        stroke-linejoin="round"/>
</svg>